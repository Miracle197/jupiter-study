<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 4 步（重做）· 周期</title>
<style>
:root { --bg: #0e121a; --surface: #151b26; --fg: #e4e8f0; --muted: #9aa3b5; --rule: #2a3242; --dot: #d8dee9; --glare: #2a303c; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.75 system-ui, "Noto Sans SC", sans-serif; margin: 0; padding: 32px 16px 48px }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px }
h1 { font-size: 28px; margin: 0 } h2 { font-size: 20px; margin: 0 }
p { margin: 0; max-width: 72ch }
.figure { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
.btns button { background: transparent; color: var(--fg); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer }
.btns button.on { background: #8aa4f0; color: #0e121a; border-color: #8aa4f0 }
svg.chart { width: 100%; height: auto; display: block }
svg text { fill: var(--muted); font-size: 13px }
.caption { font-size: 13px; color: var(--muted) }
.log { font-size: 13px; color: var(--muted); border-left: 3px solid var(--rule); padding-left: 12px }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <div class="caption">第 4 步（重做中）· 周期　|　<a href="view.html" style="color:#8aa4f0">回到主页面</a></div>
    <h1>四个天体各绕一圈要多久（重新做）</h1>
    <p>这一页从头重做第 4 步。先只看照片给出的东西：每个光点在哪一天、离木星多远。
      <b>不预先假定有几颗、也不画任何曲线、不分颜色。</b></p>
  </header>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2>① 原始材料：只有时间和位置</h2>
    <p>横轴是拍照时间，纵轴是光点沿那条线离木星中心的距离 X（单位：木星半径，第 1 步的尺子；+X 是第 3 步定下的同一头）。
      每个点是一张照片里的一个光点；误差棒是照片误差。还没有用第 4 步的比例修正。</p>
    <div class="figure">
      <svg class="chart" id="raw" viewBox="0 0 960 420" role="img" aria-label="所有光点的位置随时间"></svg>
      <div class="caption" id="raw-cap"></div>
    </div>
  </section>

  <section class="log">
    <b>更新记录</b><br>
    2026-11-11：新建本页；① 原始光点图（无卫星区分）；只保留全部时间段的一张图。
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const RANGES = [["全部", "2023-12-02T12:00", "2024-01-12T12:00"]];
const ms = (s) => new Date(s + ":00Z").getTime();   // local times, treated uniformly
let D = null, cur = 0;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function draw() {
  const svg = $("raw");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const [, a, b] = RANGES[cur];
  const t0 = ms(a), t1 = ms(b);
  const L = 60, R = 940, T = 16, B = 370;
  const x = (t) => L + (t - t0) / (t1 - t0) * (R - L);
  const y = (v) => T + (30 - v) / 60 * (B - T);
  el("rect", { x: L, y: y(2), width: R - L, height: y(-2) - y(2), fill: "var(--glare)" }, svg);
  for (let v = -30; v <= 30; v += 10) {
    el("line", { x1: L, x2: R, y1: y(v), y2: y(v), stroke: "var(--rule)", "stroke-width": v === 0 ? 1.2 : 0.6 }, svg);
    el("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = v;
  }
  // time ticks: days for long spans, hours for one night
  const span = t1 - t0, day = 864e5;
  const step = span > 20 * day ? 5 * day : span > 3 * day ? 2 * day : 3600e3;
  const first = Math.ceil(t0 / step) * step;
  for (let t = first; t <= t1; t += step) {
    const d = new Date(t);
    const lab = step >= day ? `${d.getUTCMonth() + 1}/${d.getUTCDate()}` : `${String(d.getUTCHours()).padStart(2, "0")}:00`;
    el("line", { x1: x(t), x2: x(t), y1: T, y2: B, stroke: "var(--rule)", "stroke-width": 0.6 }, svg);
    el("text", { x: x(t), y: B + 20, "text-anchor": "middle" }, svg).textContent = lab;
  }
  el("text", { x: 18, y: (T + B) / 2, transform: `rotate(-90 18 ${(T + B) / 2})`, "text-anchor": "middle" }, svg).textContent = "X（木星半径）";
  el("text", { x: (L + R) / 2, y: B + 44, "text-anchor": "middle" }, svg).textContent = step >= day ? "日期" : "当地时间";
  let n = 0;
  const photos = new Set();
  for (const p of D.dots) {
    const t = ms(p.t);
    if (t < t0 || t > t1) continue;
    n++; photos.add(p.t);
    el("line", { x1: x(t), x2: x(t), y1: y(p.X + p.err), y2: y(p.X - p.err), stroke: "#8891a0", "stroke-width": 1 }, svg);
    el("circle", { cx: x(t), cy: y(p.X), r: 3.6, fill: "var(--dot)" }, svg);
  }
  $("raw-cap").textContent = `共 ${photos.size} 个拍照时刻、${n} 个光点。灰带：木星光晕（|X| < 2），那里看不到光点。`;
}

fetch("step4_data.json", { cache: "no-store" }).then((r) => r.json()).then((d) => {
  D = d;
  draw();
});
</script>
</body>
</html>
