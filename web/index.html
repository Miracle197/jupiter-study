<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>木星卫星观测记录</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">
<style>
/* Layout: an observer's logbook — a time bar that drives everything, the photo and the 3D model side by side, then the measurements in reading order. */
:root {
  color-scheme: dark;
  --bg: #0d121c; --surface: #141b28; --surface-2: #1b2433; --line: #2a3446;
  --ink: #e7eaf0; --ink-2: #aab3c3; --ink-3: #8790a3; --accent: #d8b07a; --accent-ink: #1a1206;
  --moon-io: #3987e5; --moon-europa: #d95926; --moon-ganymede: #199e70; --moon-callisto: #c98500;
  --good: #3fa66b; --warn: #d7a23a;
  --photo-bg: #05070b; --photo-ink: #e9edf5;
  --f-display: "Spectral", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
  --f-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef1f5; --line: #d5dbe4;
    --ink: #121826; --ink-2: #485267; --ink-3: #626b7e; --accent: #8a5a22; --accent-ink: #ffffff;
    --moon-io: #2a78d6; --moon-europa: #eb6834; --moon-ganymede: #1baf7a; --moon-callisto: #eda100;
    --good: #2f8a55; --warn: #a86f00;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef1f5; --line: #d5dbe4;
  --ink: #121826; --ink-2: #485267; --ink-3: #626b7e; --accent: #8a5a22; --accent-ink: #ffffff;
  --moon-io: #2a78d6; --moon-europa: #eb6834; --moon-ganymede: #1baf7a; --moon-callisto: #eda100;
  --good: #2f8a55; --warn: #a86f00;
}

html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4.2vw, 44px); letter-spacing: -0.01em; }
h2 { font-size: 24px; }
h3 { font-size: 17px; font-family: var(--f-body); font-weight: 600; }
p { margin: 0; max-width: 68ch; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.masthead { display: grid; gap: 14px; padding-top: 28px; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 4px; }
.fact { display: grid; gap: 0; }
.masthead-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lang-btn { font-size: 13px; padding: 3px 10px; }
.fact b { font-family: var(--f-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--ink-3); }
.note {
  border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--surface); border-radius: 0 var(--r) var(--r) 0;
  font-size: 13px; color: var(--ink-2); max-width: 80ch;
}

/* time bar */
.timebar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: grid; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--line);
}
.timebar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.clock { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 0; }
.clock small { font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
}
.btn:hover { border-color: var(--ink-3); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.spacer { flex: 1 1 auto; }
.slider-wrap { position: relative; }
#t-slider { width: 100%; accent-color: var(--accent); margin: 0; }
#ticks { display: block; width: 100%; height: 18px; }
#ticks .tk { stroke: var(--ink-3); stroke-width: 2; cursor: pointer; }
#ticks .tk.on { stroke: var(--accent); stroke-width: 3; }
#ticks .tkhit { fill: transparent; cursor: pointer; }
@media (max-width: 560px) {
  .timebar { gap: 4px; padding-block: 6px; }
  .clock { font-size: 15px; flex: 1 1 100%; }
  .clock small { display: block; margin-left: 0; }
  .timebar .spacer, label[for="speed"] { display: none; }
  .timebar .btn { padding: 4px 9px; font-size: 13px; }
}
select.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 13px; }

/* workbench */
.bench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 980px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.panel { display: grid; gap: 10px; min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.panel-head h2 { font-size: 20px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.chk { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; color: var(--ink-2); }
.stage {
  position: relative; background: var(--photo-bg); border-radius: var(--r); overflow: hidden;
  aspect-ratio: 1 / 1; width: 100%; max-width: 100%;
}
.stage svg, .stage canvas { display: block; width: 100%; height: 100%; }
.stage .badge {
  position: absolute; left: 10px; top: 10px; font-size: 12px; color: var(--photo-ink); background: rgba(5, 7, 11, 0.65);
  padding: 3px 8px; border-radius: 6px; font-family: var(--f-mono); pointer-events: none;
}
.stage .legend {
  position: absolute; right: 10px; bottom: 10px; display: grid; gap: 2px; font-size: 12px; color: var(--photo-ink);
  background: rgba(5, 7, 11, 0.65); padding: 6px 9px; border-radius: 6px; pointer-events: none;
}
.ov-label { font-family: var(--f-body); fill: var(--photo-ink); paint-order: stroke; stroke: var(--photo-bg); stroke-linejoin: round; }
.scene-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.scene-label {
  position: absolute; left: 0; top: 0; font-size: 12px; color: var(--photo-ink); white-space: nowrap;
  text-shadow: 0 0 3px var(--photo-bg), 0 0 3px var(--photo-bg);
}
.scene-label--muted { opacity: 0.7; }
.pick {
  position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); font-size: 12px; color: var(--photo-ink);
  background: rgba(5, 7, 11, 0.78); padding: 7px 10px; border-radius: 6px; font-family: var(--f-mono);
}

.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px 14px; font-size: 13px; }
.info div { display: grid; }
.info dt { color: var(--ink-3); font-size: 12px; }
.info dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); }
.pill--ok { border-color: var(--good); color: var(--good); }
.pill--warn { border-color: var(--warn); color: var(--warn); }

/* sections */
section.block { display: grid; gap: 14px; padding-top: 18px; border-top: 1px solid var(--line); }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.figure { display: grid; gap: 6px; min-width: 0; }
.figure figcaption { font-size: 13px; color: var(--ink-2); }
.result { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.big { font-family: var(--f-mono); font-size: 26px; font-variant-numeric: tabular-nums; color: var(--ink); }
.multiples { display: grid; gap: 4px; }
.mult-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 8px; }
.mult-row .name { font-size: 13px; }
@media (max-width: 560px) { .mult-row { grid-template-columns: minmax(0, 1fr); } }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); align-items: center; }
.key i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ink-2); vertical-align: middle; margin-right: 6px; }
.key i.dash { border-top-style: dashed; }
.key i.dot { width: 8px; height: 8px; border: 0; border-radius: 50%; background: var(--ink-2); }
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 28px; }
.method div { display: grid; gap: 4px; align-content: start; }
.method p { font-size: 14px; color: var(--ink-2); }

/* charts */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart-grid line { stroke: var(--line); stroke-width: 1; }
.chart-grid line.v { stroke-opacity: 0.5; }
.chart-grid line.zero { stroke: var(--ink-3); stroke-opacity: 0.6; }
.chart .tick { fill: var(--ink-3); font-size: 11px; font-family: var(--f-mono); }
.chart .axis-label { fill: var(--ink-3); font-size: 11px; }
.chart .ref { stroke: var(--ink-3); stroke-dasharray: 3 3; stroke-width: 1.2; }
.chart .ref-label { fill: var(--ink-2); font-size: 11px; }
.chart .cursor { stroke: var(--accent); stroke-width: 1.5; }
.chart .pt { stroke: var(--surface); stroke-width: 1.5; }
.chart .pt--dim { opacity: 0.35; }
.chart .hit { fill: transparent; }
.chart .hit:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2; }
.chart-tip {
  position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); max-width: 260px;
}
.chart-tip b { font-weight: 600; }
.chart-tip .mono { font-size: 12px; }
.loading { color: var(--ink-3); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="masthead-top">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <button class="btn lang-btn" id="lang" type="button" data-i18n="lang.switch" data-i18n-attr="aria-label:lang.switchLabel"></button>
    </div>
    <h1 data-i18n="h1"></h1>
    <p class="muted" data-i18n="intro"></p>
    <div class="facts" id="facts"></div>
    <p class="note" id="site-note" hidden></p>
  </header>

  <div class="timebar" role="group" data-i18n-attr="aria-label:time.group">
    <div class="timebar-row">
      <div class="clock" id="clock" aria-live="polite">—</div>
      <div class="spacer"></div>
      <button class="btn" id="prev" type="button" data-i18n="btn.prev" data-i18n-attr="aria-label:btn.prev.aria"></button>
      <button class="btn" id="play" type="button" aria-pressed="false" data-i18n="btn.play"></button>
      <button class="btn" id="next" type="button" data-i18n="btn.next" data-i18n-attr="aria-label:btn.next.aria"></button>
      <label class="small muted" for="speed" data-i18n="speed"></label>
      <select class="sel" id="speed">
        <option value="1" data-i18n="speed.1"></option>
        <option value="4" selected data-i18n="speed.4"></option>
        <option value="24" data-i18n="speed.24"></option>
      </select>
    </div>
    <div class="slider-wrap">
      <input type="range" id="t-slider" min="0" max="1" step="0.0005" value="0" data-i18n-attr="aria-label:time.slider">
      <svg id="ticks" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="bench">
    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="photo.h"></h2>
        <span class="small muted" id="photo-name"></span>
      </div>
      <div class="toolbar">
        <label class="chk"><input type="checkbox" id="ov-obs" checked> <span data-i18n="ov.obs"></span></label>
        <label class="chk"><input type="checkbox" id="ov-pred" checked> <span data-i18n="ov.pred"></span></label>
        <label class="chk"><input type="checkbox" id="ov-align"> <span data-i18n="ov.align"></span></label>
      </div>
      <div class="stage" id="photo-stage">
        <svg id="photo-svg" data-i18n-attr="aria-label:photo.aria"></svg>
        <div class="badge" id="photo-badge"></div>
        <div class="legend" id="photo-legend"></div>
      </div>
      <dl class="info" id="photo-info"></dl>
      <div class="tablewrap"><table id="photo-table"></table></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="scene.h"></h2>
        <span class="small muted" data-i18n="scene.hint"></span>
      </div>
      <div class="toolbar">
        <div class="seg" role="group" data-i18n-attr="aria-label:view.group" id="views">
          <button type="button" data-view="earth" aria-pressed="true" data-i18n="view.earth"></button>
          <button type="button" data-view="top" aria-pressed="false" data-i18n="view.top"></button>
          <button type="button" data-view="side" aria-pressed="false" data-i18n="view.side"></button>
          <button type="button" data-view="free" aria-pressed="false" data-i18n="view.free"></button>
        </div>
        <div class="seg" role="group" data-i18n-attr="aria-label:mode.group" id="modes">
          <button type="button" data-mode="eph" aria-pressed="false" data-i18n="mode.eph"></button>
          <button type="button" data-mode="both" aria-pressed="true" data-i18n="mode.both"></button>
          <button type="button" data-mode="rec" aria-pressed="false" data-i18n="mode.rec"></button>
        </div>
        <label class="chk"><input type="checkbox" id="sight" checked> <span data-i18n="sight"></span></label>
      </div>
      <div class="stage" id="scene-stage">
        <div class="pick" id="pick" hidden></div>
      </div>
      <p class="small muted" data-i18n="scene.note"></p>
    </div>
  </div>

  <section class="block" id="sec-x">
    <h2 data-i18n="x.h"></h2>
    <p class="muted" data-i18n="x.p"></p>
    <div class="key">
      <span><i class="dot"></i><span data-i18n="key.obs"></span></span>
      <span><i></i><span data-i18n="key.eph"></span></span>
      <span><i class="dash"></i><span data-i18n="key.fit"></span></span>
    </div>
    <div class="multiples" id="x-multiples"><p class="loading" data-i18n="loading"></p></div>
  </section>

  <section class="block" id="sec-kepler">
    <h2 data-i18n="k.h"></h2>
    <div class="cols">
      <div class="figure">
        <div class="tablewrap"><table id="fit-table"></table></div>
        <p class="small muted" data-i18n="fit.note"></p>
      </div>
      <figure class="figure" style="margin:0">
        <div id="kepler-chart"></div>
        <figcaption id="kepler-cap"></figcaption>
      </figure>
    </div>
    <div class="cols">
      <div class="figure">
        <h3 data-i18n="mass.h"></h3>
        <div class="big" id="mass-big">—</div>
        <p class="small muted" id="mass-note"></p>
      </div>
      <div class="figure">
        <h3 data-i18n="bloom.h"></h3>
        <p class="small muted" id="bloom-note"></p>
      </div>
    </div>
  </section>

  <section class="block" id="sec-incl">
    <h2 data-i18n="i.h"></h2>
    <div class="cols">
      <figure class="figure" style="margin:0">
        <div id="incl-chart"></div>
        <figcaption data-i18n="i.cap"></figcaption>
      </figure>
      <div class="figure">
        <p id="incl-text"></p>
        <p class="small muted" data-i18n="i.bg"></p>
      </div>
    </div>
  </section>

  <section class="block" id="sec-checks">
    <h2 data-i18n="c.h"></h2>
    <div class="cols">
      <figure class="figure" style="margin:0">
        <h3 data-i18n="t.h"></h3>
        <div id="time-chart"></div>
        <figcaption id="time-cap"></figcaption>
      </figure>
      <figure class="figure" style="margin:0">
        <h3 data-i18n="o.h"></h3>
        <div class="toolbar"><label class="small muted" for="night-sel" data-i18n="o.night"></label><select class="sel" id="night-sel"></select></div>
        <div id="orient-chart"></div>
        <figcaption id="orient-cap"></figcaption>
      </figure>
    </div>
  </section>

  <section class="block">
    <h2 data-i18n="m.h"></h2>
    <div class="method">
      <div><h3 data-i18n="m1.h"></h3><p data-i18n="m1.p"></p></div>
      <div><h3 data-i18n="m2.h"></h3><p data-i18n="m2.p"></p></div>
      <div><h3 data-i18n="m3.h"></h3><p data-i18n="m3.p"></p></div>
      <div><h3 data-i18n="m4.h"></h3><p data-i18n="m4.p"></p></div>
      <div><h3 data-i18n="m5.h"></h3><p data-i18n="m5.p"></p></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/i18n.js"></script>
<script src="js/charts.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
